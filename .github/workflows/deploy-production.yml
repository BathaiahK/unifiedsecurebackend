name: Deploy to Production

on:
  workflow_run:
    workflows: ['Build & Publish Docker Images']
    types:
      - completed
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to deploy (leave empty for latest)'
        required: false
        type: string

env:
  REGISTRY: us-central1-docker.pkg.dev
  GCP_REGION: us-central1
  ENVIRONMENT: production

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify branch protection
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "✅ Deploying from protected branch"
          else
            echo "❌ Can only deploy from master/main branches"
            exit 1
          fi

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GCP credentials
        id: gcp-check
        run: |
          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "has-wif=true" >> $GITHUB_OUTPUT
            echo "✅ Workload Identity Federation configured"
          else
            echo "has-wif=false" >> $GITHUB_OUTPUT
            echo "⚠️ GCP credentials not configured"
          fi

      - name: Authenticate to Google Cloud (Workload Identity)
        if: steps.gcp-check.outputs.has-wif == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Skip deployment if no credentials
        if: steps.gcp-check.outputs.has-wif != 'true'
        run: |
          echo "⚠️ GCP credentials not configured - skipping deployment"
          exit 0

      - name: Set up Google Cloud SDK
        if: steps.gcp-check.outputs.has-wif == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Get image tag
        id: image-tag
        run: |
          if [ -z "${{ github.event.inputs.image-tag }}" ]; then
            TAG="latest"
          else
            TAG="${{ github.event.inputs.image-tag }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using image tag: ${TAG}"

      - name: Inspect current Cloud Run service
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          echo "=== Current Service Configuration ==="
          gcloud run services describe unifiedsecure-backend-api \
            --region ${{ env.GCP_REGION }} \
            --format='value(spec.template.spec.containers[0].env)' 2>/dev/null || echo "Service does not exist yet (first deployment)"

          echo ""
          echo "=== Deployment Plan ==="
          echo "Image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:${{ steps.image-tag.outputs.tag }}"
          echo "Environment Variables to set:"
          echo "  - DATABASE_URL: (secret, length: ${#DATABASE_URL})"
          echo "  - NODE_ENV: production"
          echo "  - LOG_LEVEL: warn"
          echo "  - ENVIRONMENT: production"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy API to Cloud Run
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          set -e
          echo "=== Attempting Deployment ==="
          echo "Command: gcloud run deploy unifiedsecure-backend-api"

          # Try deployment with detailed output
          gcloud run deploy unifiedsecure-backend-api \
            --image ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:${{ steps.image-tag.outputs.tag }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}",NODE_ENV=production,LOG_LEVEL=warn,ENVIRONMENT=production \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --max-instances 10 \
            --min-instances 1 \
            --ingress all \
            --allow-unauthenticated \
            --revision-suffix "prod-$(date +%s)" \
            --verbose 2>&1 | tee deployment.log || {
              echo ""
              echo "=== Deployment Failed - Investigating ==="
              echo "Exit code: $?"
              echo ""
              echo "Last 50 lines of deployment log:"
              tail -50 deployment.log
              exit 1
            }

          echo ""
          echo "✅ API deployment successful"

          echo ""
          echo "=== Verifying Deployment ==="
          gcloud run services describe unifiedsecure-backend-api \
            --region ${{ env.GCP_REGION }} \
            --format='value(spec.template.spec.containers[0].env)'

      - name: Get API service URL
        if: steps.gcp-check.outputs.has-wif == 'true'
        id: api-url
        run: |
          sleep 5
          API_URL=$(gcloud run services describe unifiedsecure-backend-api \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "url=${API_URL}" >> $GITHUB_OUTPUT
          echo "API URL: ${API_URL}"

      - name: Wait for service to stabilize
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: sleep 10

      - name: Health check - API
        if: steps.gcp-check.outputs.has-wif == 'true'
        id: health-api
        run: |
          API_URL="${{ steps.api-url.outputs.url }}"
          echo "Checking API health at: ${API_URL}/health"

          for i in {1..15}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health" 2>&1)
            CURL_EXIT=$?

            echo "Attempt $i: HTTP $HTTP_CODE (curl exit: $CURL_EXIT)"

            if [ "$CURL_EXIT" -eq 0 ] && ([ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "503" ]); then
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ API health check passed"
                echo "status=success" >> $GITHUB_OUTPUT
                exit 0
              else
                echo "⚠️ API returned 503 (starting up), retrying..."
              fi
            else
              echo "⚠️ Health check failed (curl exit: $CURL_EXIT, HTTP: $HTTP_CODE)"
            fi

            if [ "$i" -lt 15 ]; then
              echo "Retrying in 10s... ($i/15)"
              sleep 10
            fi
          done

          echo "❌ API health check failed after 15 attempts"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: Deployment summary
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          echo "## 🚀 Backend API Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "### Region: ${{ env.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tag: ${{ steps.image-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL | Health |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | ${{ steps.api-url.outputs.url }} | ${{ steps.health-api.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View in GCP Console](https://console.cloud.google.com/run?project=${{ secrets.GCP_PROJECT_ID }})" >> $GITHUB_STEP_SUMMARY
