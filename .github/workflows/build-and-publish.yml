name: Build & Publish Docker Images

on:
  workflow_run:
    workflows: ['CI - Test & Validate']
    types:
      - completed
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev
  GCP_REGION: us-central1

permissions:
  contents: read
  id-token: write

jobs:
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      ci-passed: ${{ steps.check.outputs.passed }}

    steps:
      - name: Check CI workflow status
        id: check
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"

          # Always proceed on manual trigger, check CI status on workflow_run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger detected - proceeding with build"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ CI workflow passed - proceeding with build"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "⚠️ CI workflow did not pass (conclusion: ${{ github.event.workflow_run.conclusion }})"
          fi

  build:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.ci-passed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GCP credentials
        id: gcp-check
        run: |
          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "has-wif=true" >> $GITHUB_OUTPUT
            echo "✅ Workload Identity Federation configured"
          else
            echo "has-wif=false" >> $GITHUB_OUTPUT
            echo "⚠️ GCP credentials not configured"
          fi

      - name: Authenticate to Google Cloud
        if: steps.gcp-check.outputs.has-wif == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud SDK
        if: steps.gcp-check.outputs.has-wif == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build API Docker image
        if: steps.gcp-check.outputs.has-wif == 'true'
        id: docker-build
        run: |
          TIMESTAMP=$(date +%s)
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

          echo "Building Docker image..."
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Project ID: ${{ secrets.GCP_PROJECT_ID }}"
          echo "Image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:latest"
          echo "Timestamp tag: ${TIMESTAMP}"

          docker build -t ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:latest \
            -t ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:${TIMESTAMP} \
            -f apps/api/Dockerfile \
            .

          echo "✅ Docker image built successfully"
          docker images | grep backend-api

      - name: Push API image to Artifact Registry
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          set -e
          TIMESTAMP=${{ steps.docker-build.outputs.timestamp }}
          LATEST_IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:latest"
          TIMESTAMP_IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:${TIMESTAMP}"

          echo "=== Pushing Docker Images ==="
          echo "1. Pushing ${LATEST_IMAGE}"
          docker push "${LATEST_IMAGE}" || {
            echo "❌ Failed to push latest tag"
            exit 1
          }
          echo "✅ Latest tag pushed"

          echo ""
          echo "2. Pushing ${TIMESTAMP_IMAGE}"
          docker push "${TIMESTAMP_IMAGE}" || {
            echo "❌ Failed to push timestamp tag"
            exit 1
          }
          echo "✅ Timestamp tag pushed"

          echo ""
          echo "=== Verifying Images in Artifact Registry ==="
          echo "Checking latest tag:"
          gcloud container images describe "${LATEST_IMAGE}" --format='value(image_summary.fully_qualified_digest)' || {
            echo "❌ Latest tag not found in registry!"
            exit 1
          }

          echo ""
          echo "Checking timestamp tag:"
          gcloud container images describe "${TIMESTAMP_IMAGE}" --format='value(image_summary.fully_qualified_digest)' || {
            echo "⚠️ Warning: Timestamp tag not found (will retry on next push)"
          }

          echo ""
          echo "✅ Docker images successfully pushed to Artifact Registry"

      - name: Log image details
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          echo "Image URL: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:latest"
          docker images | grep backend-api
