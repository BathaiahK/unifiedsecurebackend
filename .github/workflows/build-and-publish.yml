name: Build & Publish Docker Images

on:
  workflow_run:
    workflows: ['CI - Test & Validate']
    types:
      - completed
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: us-central1-docker.pkg.dev
  GCP_REGION: us-central1

permissions:
  contents: read
  id-token: write

jobs:
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      ci-passed: ${{ steps.check.outputs.passed }}

    steps:
      - name: Check CI workflow status
        id: check
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ CI passed or manual trigger"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "⚠️ CI did not pass"
          fi

  build:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.ci-passed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GCP credentials
        id: gcp-check
        run: |
          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "has-wif=true" >> $GITHUB_OUTPUT
            echo "✅ Workload Identity Federation configured"
          else
            echo "has-wif=false" >> $GITHUB_OUTPUT
            echo "⚠️ GCP credentials not configured"
          fi

      - name: Authenticate to Google Cloud
        if: steps.gcp-check.outputs.has-wif == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud SDK
        if: steps.gcp-check.outputs.has-wif == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build API Docker image
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:latest \
            -t ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:$(date +%s) \
            -f apps/api/Dockerfile \
            .

      - name: Push API image to Artifact Registry
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          docker push ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:latest
          docker push ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:$(date +%s)
          echo "✅ Docker image pushed to Artifact Registry"

      - name: Log image details
        if: steps.gcp-check.outputs.has-wif == 'true'
        run: |
          echo "Image URL: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/unifiedsecure/backend-api:latest"
          docker images | grep backend-api
